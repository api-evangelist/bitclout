apis:
- name: DeSo Backend API
  description: >-
    The HTTP API served by every DeSo node. It exposes transaction-construction
    endpoints (social, financial, NFT, DAO/token, associations, derived keys)
    and read/data endpoints (users, posts, profiles, NFTs, notifications,
    messages) over JSON. The public reference node is node.deso.org; the API is
    versioned under the /api/v0 path.
