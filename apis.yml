aid: bitclout
name: BitClout
description: >-
  BitClout is the original social-token network that launched the DeSo
  (Decentralized Social) blockchain, an open, layer-1 chain purpose-built for
  storing social data — profiles, posts, follows, creator coins, NFTs, and
  messages — fully on-chain. Backed by a16z and other top venture firms, the
  project rebranded to DeSo and exposes everything through an API-first,
  permissionless developer surface: a JSON HTTP backend API served by every
  node (transaction construction plus read/data endpoints), the DeSo Identity
  Service for key management and transaction signing, a first-party
  TypeScript/JavaScript SDK (deso-protocol), a Rosetta API implementation for
  exchange integration, an open-source core node, and a hosted MCP server for
  agent-based development. Openfund, a fully on-chain order-book DEX, is the
  flagship application built on the stack.
